<style>
:root{--navy:#0d1b2a;--navy2:#12263d;--blue:#1769e0;--blue2:#2f80ed;--bg:#f5f7fb;--card:#fff;--text:#17202a;--muted:#6b7280;--line:#e5e7eb;--green:#16a34a;--orange:#f59e0b;--red:#dc2626;--purple:#7c3aed;--shadow:0 2px 12px rgba(15,23,42,.07);--radius:14px}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}
.sidebar{width:240px;background:linear-gradient(180deg,#0b192a,#0e1d30);color:#fff;position:fixed;left:0;top:0;bottom:0;z-index:20;display:flex;flex-direction:column}
.brand{height:82px;display:flex;align-items:center;gap:10px;padding:0 22px;border-bottom:1px solid rgba(255,255,255,.08);font-weight:800;font-size:18px}.brand .antenna{font-size:32px;color:#65a7ff}.brand span{color:#fff}.brand b{color:#3b82f6}
.nav{padding:14px 10px;overflow:auto;flex:1}.nav-section{padding:14px 14px 6px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5d7ba0}.nav button{width:100%;border:0;background:none;color:#dbe6f5;padding:12px 14px;border-radius:8px;text-align:left;display:flex;align-items:center;gap:12px;margin:2px 0}.nav button:hover{background:rgba(255,255,255,.07)}.nav button.active{background:linear-gradient(90deg,#164ea7,#1f5fbe);color:#fff}.nav .ico{width:22px;text-align:center}.side-user{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);display:flex;gap:10px;align-items:center}.avatar{width:38px;height:38px;border-radius:50%;background:#1d5fbf;display:grid;place-items:center;color:white;font-weight:700}.side-user small{color:#aab9cc}
.main{margin-left:240px;width:calc(100% - 240px);min-width:0}.topbar{height:82px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 28px;position:sticky;top:0;z-index:10}.hamb{font-size:22px;border:0;background:none;color:#4b5563}.title{font-size:19px;font-weight:700;white-space:nowrap}.search{margin-left:30px;max-width:470px;flex:1;position:relative}.search input{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px 14px 11px 40px;background:#fbfcfe;outline:none}.search span{position:absolute;left:14px;top:9px;color:#7b8490}.top-actions{margin-left:auto;display:flex;align-items:center;gap:14px}.icon-btn{border:0;background:none;font-size:20px;color:#4b5563;position:relative}.badge-dot{position:absolute;right:-3px;top:-4px;background:#dc2626;color:#fff;font-size:9px;border-radius:10px;padding:2px 5px}.profile{display:flex;align-items:center;gap:9px;padding-left:10px;border-left:1px solid var(--line)}.profile small{display:block;color:var(--muted)}
.content{padding:24px 18px 90px;max-width:1600px;margin:auto}.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.page-head h1{margin:0;font-size:24px}.page-purpose{font-size:11.5px;font-weight:600;color:#5b8def;background:#eef5ff;border-radius:20px;padding:4px 10px;vertical-align:middle;margin-left:8px;white-space:nowrap}.page-head p{margin:5px 0 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 14px;color:#263342;font-weight:600;text-decoration:none;display:inline-block}.btn:hover{box-shadow:var(--shadow)}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.success{background:var(--green);color:#fff;border-color:var(--green)}.btn.danger{background:#fff;color:var(--red);border-color:#fecaca}.btn.small{padding:7px 10px;font-size:12px}.datebox{border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 13px;color:#334155}

.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(5,minmax(160px,1fr));margin-bottom:14px}.card{background:var(--card);border:1px solid #edf0f4;border-radius:var(--radius);box-shadow:var(--shadow)}.kpi{padding:17px;min-height:120px;position:relative}.kpi .circle{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:#fff;float:left;margin-right:12px}.c-blue{background:#397edb}.c-green{background:#28a653}.c-purple{background:#8b5cf6}.c-orange{background:#f3a712}.c-red{background:#e23b3b}.kpi .label{font-size:12px;text-transform:uppercase;color:#525c67}.kpi .value{font-size:21px;font-weight:750;margin-top:6px}.kpi .sub{font-size:12px;color:var(--muted);margin-top:8px}.kpi:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(15,23,42,.12);border-color:#d8e5f7}.kpi{transition:.15s ease}.up{color:var(--green)!important}.progress{height:7px;background:#e8edf3;border-radius:10px;margin-top:8px;overflow:hidden}.progress i{display:block;height:100%;background:#28a653;border-radius:10px}
.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:1.1fr 1fr 1.2fr}.bottom{grid-template-columns:1fr 1fr 1.25fr}.panel{padding:15px}.panel-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #edf0f4;padding-bottom:12px;margin-bottom:7px}.panel-head h3{margin:0;font-size:15px}.link{color:#2b67ad;font-size:12px;cursor:pointer}.bars .row{display:grid;grid-template-columns:115px 1fr 90px;align-items:center;gap:8px;padding:6px 0;font-size:12px}.bar{height:14px;background:#eaf0f7;border-radius:3px;overflow:hidden}.bar i{height:100%;display:block;background:#397edb}.bar.green i{background:#25a34a}.list-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 2px;border-bottom:1px solid #f0f2f5}.list-row:last-child{border-bottom:0}.time{font-weight:700;width:45px;font-size:12px}.row-main{flex:1;min-width:0}.row-main b{display:block;font-size:13px}.row-main small{color:var(--muted)}.row-icon{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#eef5ff}.tag{font-size:11px;padding:5px 8px;border-radius:6px;background:#eef5ff;color:#2863a6;white-space:nowrap}.tag.green{background:#e8f7ed;color:#16a34a}.tag.orange{background:#fff5df;color:#a86b00}.tag.red{background:#feecec;color:#dc2626}.tag.gray{background:#f0f2f5;color:#59636f}.ftxt-green{color:#16a34a}.ftxt-orange{color:#a86b00}.ftxt-red{color:#dc2626}.ftxt-gray{color:#59636f}
.insights .insight{padding:12px 4px;border-bottom:1px solid #eef1f5;display:flex;align-items:center;gap:12px}.insight:last-child{border:0}.insight .circle{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#eef3f8}.insight strong{margin-left:auto}.map{height:280px;border-radius:10px;overflow:hidden;position:relative;background:linear-gradient(140deg,#dcefd8,#eef5e9 45%,#d8e9f4 46%,#cfe4f0 100%);background-image:linear-gradient(25deg,transparent 48%,rgba(255,255,255,.8) 49%,transparent 51%),linear-gradient(155deg,transparent 48%,rgba(255,255,255,.7) 49%,transparent 51%),linear-gradient(90deg,rgba(132,171,119,.15) 1px,transparent 1px),linear-gradient(rgba(132,171,119,.15) 1px,transparent 1px);background-size:170px 130px,210px 150px,45px 45px,45px 45px}.map .water{position:absolute;width:52%;height:90%;right:-5%;top:2%;background:rgba(113,181,220,.28);border-radius:55% 0 0 45%;transform:rotate(-9deg)}.pin{position:absolute;width:16px;height:16px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 2px 4px #777}.pin::after{content:"";width:6px;height:6px;background:#fff;border-radius:50%;position:absolute;left:5px;top:5px}.p-green{background:#2aa653}.p-blue{background:#2e75d7}.p-orange{background:#f1a619}.p-red{background:#df3434}.map-label{position:absolute;font-size:12px;color:#64748b;font-weight:600}.legend{display:flex;gap:15px;padding-top:9px;font-size:11px;color:#606a75}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}

.section{display:none}.section.active{display:block}
.table-wrap{overflow:auto;cursor:grab}.table-wrap.panning{cursor:grabbing;user-select:none}.table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{padding:11px 10px;border-bottom:1px solid #edf0f4;text-align:left;font-size:13px;white-space:nowrap}.table th{background:#f8fafc;color:#667085;font-size:11px;text-transform:uppercase}.table tr:hover td{background:#fbfdff}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:10px 11px;outline:none;background:#fff;width:100%}.toolbar input{max-width:320px}.pipeline{display:grid;grid-template-columns:repeat(9,minmax(180px,1fr));gap:10px;overflow:auto;padding-bottom:10px;cursor:grab}.pipeline.panning{cursor:grabbing;user-select:none}.stage{background:#eef2f7;border-radius:10px;padding:10px;min-height:460px}.stage h4{margin:0 0 10px;font-size:13px;display:flex;justify-content:space-between}.deal{background:#fff;border:1px solid #e7ebf0;border-radius:9px;padding:11px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.04);cursor:grab}.deal b{font-size:13px}.deal small{display:block;color:var(--muted);margin:5px 0}.deal .money{font-weight:700;color:#1d4f91}.drop-target{outline:2px dashed #3b82f6}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{background:#fff;border:1px solid var(--line);min-height:110px;padding:8px;border-radius:8px}.day b{font-size:12px}.event{background:#edf5ff;color:#1f5b9d;padding:5px;border-radius:5px;margin-top:7px;font-size:11px}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field.full{grid-column:1/-1}.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}.modal.open{display:flex}.modal-box{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:15px;box-shadow:0 25px 80px rgba(0,0,0,.25)}.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.modal-body{padding:20px}.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;padding:12px 16px;border-radius:9px;box-shadow:0 10px 30px #0003;display:none;z-index:200}.toast.show{display:block}
.stat-grid{grid-template-columns:repeat(4,1fr)}.report-card{padding:18px}.report-card h3{margin:0 0 8px}.big{font-size:27px;font-weight:800}.settings{max-width:800px}.switch{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
@media(max-width:1100px){.sidebar{width:72px}.brand{padding:0 15px}.brand span,.brand b,.nav button span,.nav-section,.side-user .who{display:none}.nav button{justify-content:center}.main{margin-left:72px;width:calc(100% - 72px)}.kpis{grid-template-columns:repeat(3,1fr)}.three,.bottom{grid-template-columns:1fr 1fr}.pipeline{grid-template-columns:repeat(9,190px)}}
@media(max-width:760px){.sidebar{display:none}.sidebar.mobile-open{display:flex;width:240px;z-index:50;box-shadow:0 10px 40px rgba(0,0,0,.4)}.sidebar.mobile-open .brand span,.sidebar.mobile-open .brand b,.sidebar.mobile-open .nav button span,.sidebar.mobile-open .side-user .who{display:inline}.sidebar.mobile-open .nav-section{display:block}.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:40}.sidebar-backdrop.show{display:block}.main{margin-left:0;width:100%}.topbar{padding:0 12px;height:68px}.search{margin-left:5px}.search input{padding-left:35px}.profile .who{display:none}.content{padding:14px 10px 90px}.kpis,.two,.three,.bottom,.stat-grid{grid-template-columns:1fr}.kpi{min-height:100px}.page-head{align-items:flex-start;gap:10px;flex-direction:column}.calendar{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<div class="app">

    <button data-page="contatos"><i class="ico">👤</i><span>Contatos</span></button>
    <button data-page="oportunidades"><i class="ico">💼</i><span>Oportunidades</span></button>
    <button data-page="pipeline"><i class="ico">📊</i><span>Pipeline</span></button>
    <div class="nav-section">Operação</div>
    <button data-page="agenda"><i class="ico">📅</i><span>Agenda</span></button>
    <button data-page="tarefas"><i class="ico">✅</i><span>Tarefas</span></button>
    <button data-page="propostas"><i class="ico">📄</i><span>Propostas</span></button>
    <button data-page="produtos"><i class="ico">📦</i><span>Produtos</span></button>
    <div class="nav-section">Inteligência</div>
    <button data-page="relatorios"><i class="ico">📈</i><span>Relatórios</span></button>
    <button data-page="mapa"><i class="ico">🗺️</i><span>Mapa de Prospecção</span></button>
    <button data-page="inteligencia"><i class="ico">🧠</i><span>Inteligência Comercial</span></button>

  </nav>
  <div class="side-user"><div class="avatar">FC</div><div class="who"><b>Fábio Chiesa</b><small>Gerente de Contas</small></div></div>

<main class="main">

  <button class="hamb" onclick="toggleSidebar()">☰</button><div class="title" id="topTitle">Dashboard</div>

  <div class="top-actions"><button class="icon-btn" onclick="showPage('tarefas')">✅<em class="badge-dot" id="notifyCount">5</em></button><button class="icon-btn" onclick="showPage('agenda')">📅</button><button class="icon-btn" onclick="showPage('config')">?</button><div class="profile"><div class="avatar">FC</div><div class="who"><b>Fábio Chiesa</b><small>Gerente de Contas</small></div></div></div>

 // Baixada Fluminense — Duque de Caxias
 {name:'Businessnet Telecom',city:'Duque de Caxias',region:'Baixada Fluminense',note:'Provedor independente (Nova Campinas) — pesquisa de mercado ago/2026'},
 {name:'Cybernet Comércio e Serviços',city:'Duque de Caxias',region:'Baixada Fluminense',note:'Provedor independente (Dr. Laureano) — pesquisa de mercado ago/2026'},

 const K2_STOP=new Set(['LTDA','ME','EPP','EIRELI','SA','S','A','SERVICOS','SERVICO','COMUNICACAO','COMUNICACOES','MULTIMIDIA','TECNOLOGIA','TECNOLOGIAS','INFORMATICA','INFORMACAO','DA','DE','DO','DAS','DOS','E','EM','LTD','CIA','GRUPO','FIBRA','INTERNET','PROVEDOR','SOLUCOES','SOLUCAO','MAIS']);
 const K2_GENERIC_ALONE=new Set(['TELECOM','INTERNET','ONLINE','DIGITAL','LINK','NET','REDE','REDES','PROVEDOR','FIBRA','PLUS','PRIME','TOTAL']);
 const k2Stem=w=>w.startsWith('TELECOM')?'TELECOM':w;
 const k2NormKey=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9 ]/g,' ').split(/\s+/).filter(w=>w && !K2_STOP.has(w)).map(k2Stem).join(' ').trim();
 const k2TitleCase=s=>{
  const KEEP_UP=new Set(['LTDA','ME','EPP','EIRELI','S/A','SA','ISP','TV','RJ','SP','CX','MD','JB','G7','LC','K2']);
  const SMALL=new Set(['de','da','do','das','dos','e','em','com']);
  return String(s||'').trim().split(/\s+/).map((w,i)=>{
   const clean=w.replace(/[.,]/g,'');
   if(KEEP_UP.has(clean.toUpperCase()))return w.toUpperCase();
   const lw=w.toLowerCase();
   if(SMALL.has(lw) && i!==0)return lw;
   return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase();
  }).join(' ');
 };
 const k2FindMatch=rawName=>{
  const nk=k2NormKey(rawName);
  if(!nk)return null;
  const nkTokens=new Set(nk.split(' ').filter(Boolean));
  if(!nkTokens.size)return null;
  for(const c of data.companies){
   const ck=k2NormKey(c.name);
   if(!ck)continue;
   const ckTokens=new Set(ck.split(' ').filter(Boolean));
   if(!ckTokens.size)continue;
   const smaller=nkTokens.size<=ckTokens.size?nkTokens:ckTokens;
   const larger=smaller===nkTokens?ckTokens:nkTokens;
   let allIn=true;
   for(const t of smaller){if(!larger.has(t)){allIn=false;break;}}
   if(allIn){
    const arr=[...smaller];
    if(arr.length>=2)return c;
    if(arr.length===1 && arr[0].length>=5 && !K2_GENERIC_ALONE.has(arr[0]))return c;
   }
  }
  return null;
 };
 const k2ClassifyPhone=raw=>{
  let cel='',tel='';
  if(!raw)return {cel,tel};
  String(raw).split(/[|\/\n]/).map(p=>p.trim()).filter(Boolean).forEach(p=>{
   const core=brPhoneCore(p);
   if(!core)return;
   if(core.startsWith('0800')||core.startsWith('0300')){if(!tel)tel=formatPhoneBR(p);return;}
   if(core.length===11){if(!cel)cel=formatPhoneBR(p);}
   else if(core.length===10){if(!tel)tel=formatPhoneBR(p);}
  });
  return {cel,tel};
 };
 const k2FirstEmail=raw=>{
  if(!raw)return '';
  return String(raw).split(/[\/\n]/).map(p=>p.trim()).filter(Boolean)[0]||'';
 };
 let nextId=data.companies.reduce((m,c)=>Math.max(m,Number(c.id)||0),0)+1;
 let addedCompanies=0,addedContacts=0,mergedIntoExisting=0;

 K2_V1.forEach((r,idx)=>{

  }else{

   data.companies.push({id:nextId++,name:companyName,city:'',phone:cel||tel||'',segment:r.segment==='ISP'?'ISP':'Corporativo',status:'Fechado',origin:'Carteira',owner:'Fábio Chiesa',leadScore:100});
   addedCompanies++;
  }
  if(r.contato){
   const rawContatoName=r.contato.split(/[|\/]/)[0].trim();
   const contactName=k2TitleCase(rawContatoName);
   const key=(contactName+'|'+companyName).toLowerCase();
   if(contactName && !existingContactKey.has(key)){
    data.contacts.push({id:Date.now()+idx+Math.random(),name:contactName,company:companyName,role:'',cel,tel,email:k2FirstEmail(r.email)});
    existingContactKey.add(key);
    addedContacts++;
   }
  }
 });

function setSyncConfig(cfg){localStorage.setItem(SYNC_CFG_KEY,JSON.stringify(cfg));_supaClient=null}
function getSyncClient(){
 const cfg=getSyncConfig();
 if(!cfg||!cfg.url||!cfg.key||!cfg.syncId)return null;
 if(typeof window.supabase==='undefined')return null;
 if(!_supaClient)_supaClient=window.supabase.createClient(cfg.url,cfg.key);
 return _supaClient;
}
function syncStatusText(){
 const cfg=getSyncConfig();
 if(!cfg||!cfg.url||!cfg.key||!cfg.syncId)return 'Sincronização não configurada';
 const last=localStorage.getItem(SYNC_LAST_KEY);
 if(!last)return 'Configurado, ainda sem sincronizar';
 return 'Última sincronização: '+new Date(last).toLocaleString('pt-BR');
}
function updateSyncStatusUI(){const el=document.getElementById('syncStatusText');if(el)el.textContent=syncStatusText()}
function scheduleCloudPush(){
 const cfg=getSyncConfig();
 if(!cfg||!cfg.url||!cfg.key||!cfg.syncId)return;
 localStorage.setItem(SYNC_PENDING_KEY,'1'); // marca que há alteração local ainda não enviada (sobrevive a fechar o app)
 clearTimeout(_cloudPushTimer);
 _cloudPushTimer=setTimeout(()=>pushToCloud(true),1500);
}
async function pushToCloud(silent){
 const client=getSyncClient();
 if(!client){if(!silent)toast('Configure a sincronização em Configurações');return}
 const cfg=getSyncConfig();
 try{
  const nowIso=new Date().toISOString();
  const {error}=await client.from(SYNC_TABLE).upsert({id:cfg.syncId,payload:data,updated_at:nowIso});
  if(error){if(!silent)toast('Erro ao sincronizar: '+error.message);return}
  localStorage.setItem(SYNC_LAST_KEY,nowIso);
  localStorage.removeItem(SYNC_PENDING_KEY); // envio confirmado, não há mais nada pendente
  updateSyncStatusUI();
  if(!silent)toast('Enviado para a nuvem com sucesso');
 }catch(e){if(!silent)toast('Erro ao sincronizar: '+e.message)}
}
function flushPendingPushNow(){
 // usado ao minimizar/fechar o app: cancela o debounce de 1.5s e envia imediatamente
 if(!localStorage.getItem(SYNC_PENDING_KEY))return;
 clearTimeout(_cloudPushTimer);
 _cloudPushTimer=null;
 pushToCloud(true);
}
async function pullFromCloud(mode){
 // mode: false/undefined = manual (pede confirmação), true = checagem antiga (compat), 'auto' = automático silencioso
 const client=getSyncClient();
 if(!client){if(mode===false)toast('Configure a sincronização em Configurações');return}
 const cfg=getSyncConfig();
 try{
  const {data:row,error}=await client.from(SYNC_TABLE).select('payload,updated_at').eq('id',cfg.syncId).maybeSingle();
  if(error){if(mode===false)toast('Erro ao buscar dados da nuvem: '+error.message);return}
  if(!row){if(mode===false)toast('Nenhum dado encontrado na nuvem para este código de sincronização ainda');return}
  const localLast=localStorage.getItem(SYNC_LAST_KEY);
  const isNewer=!localLast||new Date(row.updated_at)>new Date(localLast);
  if(mode==='auto'){
   if(!isNewer)return;
   if(document.querySelector('.modal.open'))return; // não interromper edição em andamento
   if(_cloudPushTimer)return; // há alteração local pendente de envio, espera terminar
   if(localStorage.getItem(SYNC_PENDING_KEY))return; // há alteração local ainda não confirmada na nuvem (mesmo após reabrir o app) — nunca sobrescrever
   _suppressCloudPush=true;
   data=row.payload;
   save();
   _suppressCloudPush=false;
   localStorage.setItem(SYNC_LAST_KEY,row.updated_at);
   updateSyncStatusUI();
   return;
  }
  if(mode===true){
   if(isNewer)toast('Há dados mais novos na nuvem — toque em "Buscar da nuvem" em Configurações para atualizar');
   return;
  }
  showConfirm('Importar dados da nuvem (atualizados em '+new Date(row.updated_at).toLocaleString('pt-BR')+')? Isso substituirá os dados deste dispositivo (um backup de segurança será baixado antes).',()=>{
   silentBackup();
   _suppressCloudPush=true;
   data=row.payload;
   save();
   _suppressCloudPush=false;
   localStorage.setItem(SYNC_LAST_KEY,row.updated_at);
   updateSyncStatusUI();
   toast('Dados importados da nuvem');
  },'Importar');
 }catch(e){if(mode===false)toast('Erro ao buscar dados da nuvem: '+e.message)}
}
let _autoSyncInterval=null;
function startAutoSync(){
 if(_autoSyncInterval)clearInterval(_autoSyncInterval);
 if(!getSyncConfig())return;
 _autoSyncInterval=setInterval(()=>{if(document.visibilityState==='visible')pullFromCloud('auto')},15000);
 document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible')pullFromCloud('auto');
  else flushPendingPushNow(); // app foi para 2º plano: envia qualquer alteração pendente imediatamente, sem esperar
 });
 window.addEventListener('pagehide',flushPendingPushNow);
}
// Colunas flutuantes: clicar e segurar no título da coluna (th) para reordenar,
// em qualquer tabela do CRM. A ordem escolhida fica salva por tipo de tabela.
function getColumnOrder(groupKey,colCount){
 try{
  const saved=JSON.parse(localStorage.getItem('colorder_'+groupKey)||'null');
  if(Array.isArray(saved)&&saved.length===colCount)return saved;
 }catch(e){}
 return null;
}
function saveColumnOrder(groupKey,order){
 localStorage.setItem('colorder_'+groupKey,JSON.stringify(order));
}
function applyColumnOrder(table){
 const groupKey=table.dataset.tableGroup||table.id;
 if(!groupKey)return;
 const headRow=table.querySelector('thead tr');
 if(!headRow)return;
 const currentCols=[...headRow.children].map(th=>th.dataset.col);
 const order=getColumnOrder(groupKey,currentCols.length);
 if(!order||!order.every(c=>currentCols.includes(c)))return;
 const rows=[headRow,...table.querySelectorAll('tbody tr')];
 rows.forEach(row=>{
  if(row.children.length!==currentCols.length)return; // pula linhas com colspan diferente
  const cellsByCol={};
  [...row.children].forEach((cell,i)=>{cellsByCol[currentCols[i]]=cell});
  order.forEach(colId=>{if(cellsByCol[colId])row.appendChild(cellsByCol[colId])});
 });
}
function moveColumn(table,fromIdx,toIdx){
 if(fromIdx===toIdx)return;
 const rows=[table.querySelector('thead tr'),...table.querySelectorAll('tbody tr')].filter(Boolean);
 rows.forEach(row=>{
  const cells=row.children;
  if(cells.length<=fromIdx||cells.length<=toIdx)return;
  const moved=cells[fromIdx];
  const ref=cells[toIdx];
  if(fromIdx<toIdx)row.insertBefore(moved,ref.nextSibling);
  else row.insertBefore(moved,ref);
 });
}
function persistColumnOrder(table){
 const groupKey=table.dataset.tableGroup||table.id;
 if(!groupKey)return;
 const order=[...table.querySelectorAll('thead th')].map(th=>th.dataset.col);
 saveColumnOrder(groupKey,order);
}
function makeTableColumnsReorderable(table){
 const headRow=table.querySelector('thead tr');
 if(!headRow||table.dataset.reorderBound)return;
 table.dataset.reorderBound='1';
 let dragFromIdx=null;
 headRow.addEventListener('dragstart',(e)=>{
  const th=e.target.closest('th');
  if(!th)return;
  dragFromIdx=[...headRow.children].indexOf(th);
  e.dataTransfer.effectAllowed='move';
  th.style.opacity='0.4';
 });
 headRow.addEventListener('dragend',(e)=>{
  const th=e.target.closest('th');
  if(th)th.style.opacity='';
  headRow.querySelectorAll('th').forEach(t=>t.style.background='');
 });
 headRow.addEventListener('dragover',(e)=>{
  const th=e.target.closest('th');
  if(!th)return;
  e.preventDefault();
  th.style.background='#eef5ff';
 });
 headRow.addEventListener('dragleave',(e)=>{
  const th=e.target.closest('th');
  if(th)th.style.background='';
 });
 headRow.addEventListener('drop',(e)=>{
  const th=e.target.closest('th');
  if(!th||dragFromIdx===null)return;
  e.preventDefault();
  th.style.background='';
  const toIdx=[...headRow.children].indexOf(th);
  moveColumn(table,dragFromIdx,toIdx);
  persistColumnOrder(table);
  dragFromIdx=null;
 });
 [...headRow.children].forEach(th=>{
  th.draggable=true;
  th.style.cursor='grab';
  th.title=(th.title?th.title+' · ':'')+'Arraste para reordenar a coluna';
 });
}
function setupReorderableTables(rootId){
 const root=document.getElementById(rootId);
 if(!root)return;
 root.querySelectorAll('table[data-table-group], table[id]').forEach(table=>{
  if(!table.dataset.tableGroup&&!table.id)return;
  applyColumnOrder(table);
  makeTableColumnsReorderable(table);
 });
}
// Colunas flutuantes do Pipeline: mesma ideia, mas reordenando os blocos
// .stage (divs) inteiros, não linhas de tabela — clicar e segurar no título
// da coluna (h4) e arrastar para outra coluna troca as duas de lugar.
function persistPipelineColumnOrder(){
 const pipelineEl=document.querySelector('#pipeline .pipeline');
 if(!pipelineEl)return;
 const order=[...pipelineEl.children].map(el=>el.dataset.colId);
 localStorage.setItem('colorder_pipeline',JSON.stringify(order));
}
function applyPipelineColumnOrder(){
 const pipelineEl=document.querySelector('#pipeline .pipeline');
 if(!pipelineEl)return;
 let saved;
 try{saved=JSON.parse(localStorage.getItem('colorder_pipeline')||'null')}catch(e){}
 if(!Array.isArray(saved))return;
 const current=[...pipelineEl.children];
 const byId={};
 current.forEach(el=>{byId[el.dataset.colId]=el});
 if(saved.length!==current.length||!saved.every(id=>byId[id]))return;
 saved.forEach(id=>pipelineEl.appendChild(byId[id]));
}
function initPipelineColumnReorder(){
 const pipelineEl=document.querySelector('#pipeline .pipeline');
 if(!pipelineEl)return;
 let dragged=null;
 pipelineEl.querySelectorAll('.stage > h4').forEach(h4=>{
  const stageEl=h4.parentElement;
  h4.draggable=true;
  h4.style.cursor='grab';
  h4.addEventListener('dragstart',(e)=>{
   dragged=stageEl;
   e.dataTransfer.setData('application/x-pipeline-col',stageEl.dataset.colId||'');
   e.dataTransfer.effectAllowed='move';
   stageEl.style.opacity='0.4';
  });
  h4.addEventListener('dragend',()=>{if(dragged)dragged.style.opacity='';dragged=null});
  h4.addEventListener('dragover',(e)=>{
   if(!e.dataTransfer.types.includes('application/x-pipeline-col'))return;
   e.preventDefault();e.stopPropagation();
   stageEl.style.outline='2px dashed #3b82f6';
  });
  h4.addEventListener('dragleave',()=>{stageEl.style.outline=''});
  h4.addEventListener('drop',(e)=>{
   if(!e.dataTransfer.types.includes('application/x-pipeline-col'))return;
   e.preventDefault();e.stopPropagation();
   stageEl.style.outline='';
   if(!dragged||dragged===stageEl)return;
   const all=[...pipelineEl.children];
   const fromIdx=all.indexOf(dragged),toIdx=all.indexOf(stageEl);
   if(fromIdx<toIdx)pipelineEl.insertBefore(dragged,stageEl.nextSibling);
   else pipelineEl.insertBefore(dragged,stageEl);
   persistPipelineColumnOrder();
  });
 });
}
function initPipelinePan(){
 // Clicar e segurar fora dos cards/links/botões rola horizontalmente (Pipeline e qualquer tabela do CRM)
 let panEl=null,startX=0,startScroll=0,isPanning=false,moved=false;
 document.addEventListener('mousedown',(e)=>{
  const panTarget=e.target.closest('.pipeline, .table-wrap');
  if(!panTarget)return;
  if(e.target.closest('[draggable="true"]'))return;
  if(e.target.closest('button,a,input,select,textarea'))return;
  isPanning=true;moved=false;
  panEl=panTarget;
  startX=e.pageX;
  startScroll=panTarget.scrollLeft;
  panEl.classList.add('panning');
 });
 document.addEventListener('mousemove',(e)=>{
  if(!isPanning||!panEl)return;
  const walk=e.pageX-startX;
  if(Math.abs(walk)>3)moved=true;
  if(moved){e.preventDefault();panEl.scrollLeft=startScroll-walk}
 });
 function stopPan(){
  if(panEl)panEl.classList.remove('panning');
  isPanning=false;moved=false;panEl=null;
 }
 document.addEventListener('mouseup',stopPan);
 document.addEventListener('mouseleave',stopPan);
}

function today(){return new Date().toISOString().slice(0,10)}
function digits(s){return String(s||'').replace(/\D/g,'')}
function dedupeDoubledDigits(d){
 const n=d.length;
 if(n>=20&&n%2===0){
  const half=n/2;
  if(d.slice(0,half)===d.slice(half))return d.slice(0,half);
 }
 return d;
}
function brPhoneCore(raw){
 let d=dedupeDoubledDigits(digits(raw));
 if(!d)return '';
 if(d.startsWith('0800')||d.startsWith('0300'))return d;
 if(d.startsWith('55')&&d.length>11)d=d.slice(2);
 if(d.length>10&&d.startsWith('0'))d=d.slice(1);
 return d;
}
function waDigits(raw){
 const core=brPhoneCore(raw);
 if(!core)return '';
 if(core.startsWith('0800')||core.startsWith('0300'))return core;
 return '55'+core;
}
function isValidEmail(v){return !v || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v).trim())}
function isValidPhoneField(v){
 if(!v)return true;
 const core=brPhoneCore(v);
 if(!core)return false;
 if(core.startsWith('0800')||core.startsWith('0300'))return true;
 return core.length===10||core.length===11;
}
function isValidCNPJ(v){
 if(!v)return true;
 const c=digits(v);
 if(c.length!==14)return false;
 if(/^(\d)\1{13}$/.test(c))return false;
 const calcDigit=(base)=>{
  const weights=base.length===12?[5,4,3,2,9,8,7,6,5,4,3,2]:[6,5,4,3,2,9,8,7,6,5,4,3,2];
  let sum=0;for(let i=0;i<base.length;i++)sum+=Number(base[i])*weights[i];
  const r=sum%11;
  return r<2?0:11-r;
 };
 if(calcDigit(c.slice(0,12))!==Number(c[12]))return false;
 if(calcDigit(c.slice(0,13))!==Number(c[13]))return false;
 return true;
}
function formatCNPJ(raw){const c=digits(raw);if(c.length!==14)return String(raw).trim();return c.slice(0,2)+'.'+c.slice(2,5)+'.'+c.slice(5,8)+'/'+c.slice(8,12)+'-'+c.slice(12)}
function formatPhoneBR(raw){
 const core=brPhoneCore(raw);
 if(!core)return '';
 if(core.startsWith('0800')||core.startsWith('0300'))return String(raw).trim();
 if(core.length===11)return '+55 ('+core.slice(0,2)+') '+core.slice(2,7)+'-'+core.slice(7);
 if(core.length===10)return '+55 ('+core.slice(0,2)+') '+core.slice(2,6)+'-'+core.slice(6);
 return String(raw).trim();
}

function companyLastActivity(companyName){
 if(!companyName)return null;
 const dates=[];
 data.tasks.filter(t=>t.company===companyName).forEach(t=>{if(t.date)dates.push(t.date)});
 data.proposals.filter(p=>p.company===companyName).forEach(p=>{if(p.date)dates.push(p.date)});
 data.deals.filter(d=>d.company===companyName).forEach(d=>{if(d.next)dates.push(d.next)});
 if(data.contactLog && data.contactLog[companyName])dates.push(data.contactLog[companyName]);
 if(!dates.length)return null;
 dates.sort();
 return dates[dates.length-1];
}
function brDate(iso){if(!iso)return'';const[y,m,d]=iso.split('-');return d&&m&&y?`${d}/${m}/${y}`:iso}
function companyFollowupInfo(company){
 const last=companyLastActivity(company.name);
 let days;
 if(last){
  days=Math.floor((new Date(today())-new Date(last))/86400000);
 } else {
  const created=Number(String(company.id).split('.')[0]);
  days=isFinite(created)&&created>1e9?Math.floor((Date.now()-created)/86400000):null;
 }
 if(days===null)return{cls:'gray',ic:'⚪',label:'Sem data',stale:false,days:null,date:null};
 if(!last)return{cls:'gray',ic:'⚫',label:days<=1?'Nunca contatado':`Nunca contatado (${days}d)`,stale:days>10,days,date:null};
 if(days<0)days=0;
 if(days<=10)return{cls:'green',ic:'🟢',label:(days===0?'Hoje':'Há '+days+'d')+' · '+brDate(last),stale:false,days,date:last};
 if(days<=15)return{cls:'orange',ic:'🟡',label:'Há '+days+'d · '+brDate(last)+' · atenção',stale:false,days,date:last};
 return{cls:'red',ic:'🔴',label:'Esquecido há '+days+'d · '+brDate(last),stale:true,days,date:last};
}

 if(!companyName)return;
 data.contactLog=data.contactLog||{};
 data.contactLog[companyName]=today();
 data.contactHistory=data.contactHistory||[];
 const now=new Date();
 const nextId=Math.max(0,...data.contactHistory.map(h=>h.id||0))+1;
 data.contactHistory.push({id:nextId,company:companyName,contactName:contactName||'',channel:channel||'outro',date:today(),time:now.toTimeString().slice(0,5),outcome:null});
 save();
}

 if(!list.length)return null;
 return list.reduce((a,b)=>(a.date+a.time)>(b.date+b.time)?a:b);
}

function calcGoalPlan(){
 const target=data.settings.monthlyTarget;
 const now=new Date();
 const closed=data.deals.filter(d=>d.stage==='Fechado').reduce((a,d)=>a+Number(d.value||0),0);
 const openDeals=data.deals.filter(d=>d.stage!=='Fechado'&&d.stage!=='Perdido');
 const weightedPipeline=openDeals.reduce((a,d)=>a+Number(d.value||0)*Number(d.prob||0)/100,0);
 let deadline=new Date(now.getFullYear(),now.getMonth(),25,23,59,59);
 if(now.getDate()>25)deadline=new Date(now.getFullYear(),now.getMonth()+1,25,23,59,59);
 const daysLeft=Math.max(1,Math.ceil((deadline-now)/86400000));
 const weeksLeft=Math.max(1,Math.ceil(daysLeft/7));
 const remaining=Math.max(0,target-closed-weightedPipeline);
 const closedDeals=data.deals.filter(d=>d.stage==='Fechado');
 const avgTicket=closedDeals.length?closedDeals.reduce((a,d)=>a+Number(d.value||0),0)/closedDeals.length:(data.deals.length?data.deals.reduce((a,d)=>a+Number(d.value||0),0)/data.deals.length:target||1);
 const conversion=Number(data.settings.leadConversionRate)>0?Number(data.settings.leadConversionRate):0.07;
 const dealsNeeded=avgTicket>0?Math.ceil(remaining/avgTicket):0;
 const leadsNeeded=Math.ceil(dealsNeeded/conversion);
 const leadsPerWeek=Math.ceil(leadsNeeded/weeksLeft);
 const valuePerWeek=remaining/weeksLeft;
 const pct=target>0?Math.min(100,Math.round((closed/target)*100)):0;
 return{target,closed,weightedPipeline,remaining,deadline,daysLeft,weeksLeft,avgTicket,conversion,dealsNeeded,leadsNeeded,leadsPerWeek,valuePerWeek,pct,achieved:remaining<=0};
}
function weeklyLeadIntel(g){
 const wk=isoWeekOf(new Date(today()+'T00:00:00'));
 const startStr=wk.start.toISOString().slice(0,10),endStr=wk.end.toISOString().slice(0,10);
 const history=buildContactHistory().filter(h=>h.date>=startStr&&h.date<=endStr);
 const contactedCompanies=new Set(history.map(h=>h.company));
 const weeklyTarget=Math.max(g.leadsPerWeek,5);
 const suggestions=[...data.companies]
  .filter(c=>!contactedCompanies.has(c.name))
  .sort((a,b)=>computeIntelScore(b).score-computeIntelScore(a).score)
  .slice(0,weeklyTarget);
 return {week:wk,contactedCount:contactedCompanies.size,weeklyTarget,suggestions};
}

function applyCompanyFilters(){
 const q=(_companyFilters.search||'').toLowerCase().trim();
 const origin=_companyFilters.origin||'';
 const region=_companyFilters.region||'';
 const anyActive=!!(q||origin||region);
 document.querySelectorAll('#empresas .collapsible-group').forEach(group=>{
  const body=group.querySelector('.group-body');
  const icon=body?document.getElementById(body.id+'-icon'):null;
  let anyVisible=false;
  group.querySelectorAll('tbody tr').forEach(r=>{
   const show=(!q||r.innerText.toLowerCase().includes(q))&&(!origin||r.dataset.origin===origin)&&(!region||r.dataset.region===region);
   r.style.display=show?'':'none';
   if(show)anyVisible=true;
  });
  if(body){
   if(anyActive){body.style.display=anyVisible?'':'none';if(icon)icon.textContent=anyVisible?'▾':'▸'}
   else{body.style.display='none';if(icon)icon.textContent='▸'}
  }
 });
}

function companyMagnitude(c){
 const mv=Number(c.monthlyValue);
 if(mv>0)return mv;
 return Number(c.leadScore)||0;
}
function computeIntelScore(c){
 const parts=[];
 // 1) Potencial de receita (0-40 pts)
 const mv=Number(c.monthlyValue)||0;
 let potencial;
 if(mv>0){potencial=Math.min(40,Math.round(mv/5000*40));parts.push({label:'Potencial de receita',pts:potencial,detail:money(mv)+'/mês'})}
 else{const ls=Number(c.leadScore)||0;potencial=Math.round(ls/100*40);parts.push({label:'Potencial de receita',pts:potencial,detail:'Lead Score manual: '+ls})}
 // 2) Engajamento: produtivo vs improdutivo (0-30 pts, neutro=15 sem histórico)
 const hist=(data.contactHistory||[]).filter(h=>h.company===c.name&&h.outcome);
 let engajamento,engDetail;
 if(hist.length){
  const prod=hist.filter(h=>h.outcome==='produtivo').length;
  const ratio=prod/hist.length;
  engajamento=Math.round(ratio*30);
  engDetail=prod+' produtivo(s) de '+hist.length+' contato(s) avaliado(s)';
 }else{engajamento=15;engDetail='Ainda sem contatos avaliados (produtivo/improdutivo)'}
 parts.push({label:'Engajamento nos contatos',pts:engajamento,detail:engDetail});
 // 3) Tempo parado na etapa (0-30 pts, mais recente = mais pontos; neutro=15 sem oportunidade aberta)
 const openDeal=data.deals.filter(d=>d.company===c.name&&d.stage!=='Fechado'&&d.stage!=='Perdido').sort((a,b)=>(a.stageEnteredAt||'')<(b.stageEnteredAt||'')?1:-1)[0];
 let frescor,frescorDetail;
 if(openDeal&&openDeal.stageEnteredAt){
  const days=Math.floor((new Date(today())-new Date(openDeal.stageEnteredAt+'T00:00:00'))/86400000);
  frescor=Math.max(0,30-Math.round(days/30*30));
  frescorDetail=days+' dia(s) parado em "'+openDeal.stage+'"';
 }else{frescor=15;frescorDetail=openDeal?'Sem data de entrada na etapa registrada':'Sem oportunidade em aberto no momento'}
 parts.push({label:'Tempo parado na etapa',pts:frescor,detail:frescorDetail});
 const score=potencial+engajamento+frescor;
 return {score,parts};
}

function firstBusinessDay(year,monthIndex){
 let d=new Date(year,monthIndex,1);
 while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()+1);
 return d;
}

function isoWeekOf(d){
 const day=(d.getDay()+6)%7;
 const monday=new Date(d);monday.setDate(d.getDate()-day);
 const sunday=new Date(monday);sunday.setDate(monday.getDate()+6);
 return {start:monday,end:sunday,key:monday.toISOString().slice(0,10)};
}

function buildContactHistory(){

 return fromClicks.concat(fromTasks);

function generateContactReport(){
 const mode=window._reportMode||'month';
 let start,end;
 if(mode==='month'){
  const my=document.getElementById('reportMonthSelect').value;
  const [y,m]=my.split('-').map(Number);
  start=firstBusinessDay(y,m-1);
  const lastDay=lastDayOfMonth(y,m-1);
  const todayD=new Date(today()+'T00:00:00');
  end=lastDay<todayD?lastDay:todayD;
  if(end<start){document.getElementById('contactReportResults').innerHTML='<p style="color:#8a94a3;padding:14px 0">Não há dados para o período selecionado (mês futuro).</p>';return}
 }else{
  const s=document.getElementById('reportStartDate').value;
  const e=document.getElementById('reportEndDate').value;
  if(!s||!e){toast('Informe as datas de início e fim');return}
  start=new Date(s+'T00:00:00');end=new Date(e+'T00:00:00');
  if(end<start){toast('A data final deve ser posterior à data inicial');return}
 }
 const startStr=start.toISOString().slice(0,10),endStr=end.toISOString().slice(0,10);
 const history=buildContactHistory().filter(h=>h.date>=startStr&&h.date<=endStr);
 const weeks=new Map();
 history.forEach(h=>{
  const hd=new Date(h.date+'T00:00:00');
  const wk=isoWeekOf(hd);
  if(!weeks.has(wk.key))weeks.set(wk.key,{start:wk.start,end:wk.end,companies:new Set(),tel:0,wa:0,items:[]});
  const w=weeks.get(wk.key);
  w.companies.add(h.company);
  if(h.channel==='whatsapp')w.wa++;else if(h.channel==='telefone')w.tel++;
  w.items.push(h);
 });
 const weekKeys=[...weeks.keys()].sort();
 if(!weekKeys.length){
  const allHistory=buildContactHistory();
  const totalTasksLig=data.tasks.filter(t=>t.status==='Concluída'&&t.type==='Ligação').length;
  const totalTasksWa=data.tasks.filter(t=>t.status==='Concluída'&&t.type==='WhatsApp').length;
  const totalClicks=(data.contactHistory||[]).length;
  const datesFound=allHistory.map(h=>h.date).sort();
  const diag=allHistory.length?`<br><br><small style="color:#8a94a3">Diagnóstico: ${allHistory.length} atividade(s) no total no CRM (${totalTasksLig} tarefa(s) de Ligação concluída, ${totalTasksWa} de WhatsApp concluída, ${totalClicks} clique(s) registrado(s)), datadas entre ${datesFound[0]} e ${datesFound[datesFound.length-1]}. Nenhuma cai no período ${startStr} a ${endStr} selecionado.</small>`:`<br><br><small style="color:#8a94a3">Diagnóstico: não há nenhuma tarefa de tipo Ligação/WhatsApp com status "Concluída" nem cliques registrados em todo o CRM. Confira se as tarefas estão com o tipo e status corretos.</small>`;
  document.getElementById('contactReportResults').innerHTML=`<p style="color:#8a94a3;padding:14px 0">Nenhum contato registrado no período de ${fmtDateBR(start)} a ${fmtDateBR(end)}.${diag}</p>`;
  return;
 }
 const totalCompanies=new Set();let totalTel=0,totalWa=0;
 const rows=weekKeys.map((k,i)=>{
  const w=weeks.get(k);
  w.companies.forEach(c=>totalCompanies.add(c));
  totalTel+=w.tel;totalWa+=w.wa;
  return `<tr><td>Semana ${i+1}<br><small style="color:#8a94a3">${fmtDateBR(w.start)} – ${fmtDateBR(w.end)}</small></td><td><b>${w.companies.size}</b></td><td>☎️ ${w.tel}</td><td>💬 ${w.wa}</td><td>${w.tel+w.wa}</td><td><button class="btn small" onclick="showWeekContactDetails('${k}')">Ver empresas</button></td></tr>`;
 }).join('');
 window._reportWeeks=weeks;
 window._reportPeriod={start,end};
 document.getElementById('contactReportResults').innerHTML=`<div class="grid stat-grid" style="margin-bottom:14px">${reportCard('Período',fmtDateBR(start)+' – '+fmtDateBR(end))}${reportCard('Empresas contatadas',totalCompanies.size,"showPeriodContactDetails()")}${reportCard('Contatos por telefone',totalTel)}${reportCard('Contatos por WhatsApp',totalWa)}</div><div class="card table-wrap"><table class="table"><thead><tr><th>Semana</th><th>Empresas contatadas</th><th>Telefone</th><th>WhatsApp</th><th>Total contatos</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function copyToClipboard(text){
 const done=()=>toast('Link copiado! Cole no navegador ou no app do Google Maps');
 const fail=()=>{
  try{
   const ta=document.createElement('textarea');
   ta.value=text;ta.style.position='fixed';ta.style.opacity='0';ta.style.top='0';ta.style.left='0';
   document.body.appendChild(ta);ta.focus();ta.select();
   document.execCommand('copy');
   document.body.removeChild(ta);
   done();
  }catch(e){toast('Não foi possível copiar. Link: '+text)}
 };
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done).catch(fail)}else{fail()}
}

function saveMonthlyTarget(){
 const v=Number(document.getElementById('monthlyTargetInput').value);

 data.settings.monthlyTarget=v;
 save();
 toast('Meta mensal atualizada para '+money(v));
}
function saveConversionRate(){
 const v=Number(document.getElementById('conversionRateInput').value);
 if(!v||v<=0||v>100){toast('Informe uma taxa de conversão válida (0–100%)');return}
 data.settings.leadConversionRate=v/100;
 save();
 toast('Taxa de conversão atualizada para '+v+'%');
}

function openDashboardDetails(type){
  const modal=document.getElementById('dashboardDetailModal');
  const title=document.getElementById('dashboardDetailTitle');
  const body=document.getElementById('dashboardDetailBody');
  const action=document.getElementById('dashboardDetailAction');
  let items=[], heading='', destination='tarefas';

  if(type==='calls'){
    items=data.tasks.filter(t=>t.type==='Ligação' && t.date===today() && t.status!=='Concluída');
    heading='Ligações pendentes para hoje';
    destination='tarefas';
    body.innerHTML = items.length ? `
      <p style="margin-top:0;color:#667085">Estas são as ligações que ainda precisam ser realizadas hoje.</p>
      ${items.map(t=>detailItem(
        t.time,
        t.company,
        t.title,
        `<span class="tag orange">${t.status}</span>`
      )).join('')}
      <div class="card panel" style="margin-top:12px;background:#f8fafc">
        <b>Total pendente: ${items.length}</b>
      </div>` : emptyDetail('Não existem ligações pendentes para hoje.');
  }
  else if(type==='overdue'){
    items=data.tasks.filter(t=>t.date<today() && t.status!=='Concluída');
    heading='Follow-ups atrasados';
    destination='tarefas';
    body.innerHTML = items.length ? `
      <p style="margin-top:0;color:#667085">Tarefas com data anterior a hoje e ainda não concluídas.</p>
      ${items.map(t=>detailItem(
        t.date+' '+t.time,
        t.company,
        t.title,
        `<span class="tag red">Atrasada</span>`
      )).join('')}` : emptyDetail('Nenhum follow-up atrasado.');
  }
  else if(type==='pipeline'){
    items=data.deals.filter(d=>d.stage!=='Fechado'&&d.stage!=='Perdido').sort((a,b)=>b.value-a.value);
    heading='Detalhes do Pipeline';
    destination='pipeline';
    body.innerHTML = items.length ? `
      <p style="margin-top:0;color:#667085">Oportunidades abertas, ordenadas pelo maior valor.</p>
      ${items.map(d=>detailItem(
        d.stage,
        d.company,
        d.title,
        `<b>${money(d.value)}</b> <span class="tag ${d.prob>=60?'green':d.prob>=40?'orange':''}">${d.prob}%</span>`
      )).join('')}` : emptyDetail('Nenhuma oportunidade aberta.');
  }
  else if(type==='closed'){
    const period=_dashboardPeriod||defaultDashboardPeriod();
    items=data.deals.filter(d=>d.stage==='Fechado'&&d.closedAt&&d.closedAt>=period.start&&d.closedAt<=period.end).sort((a,b)=>b.value-a.value);
    heading='Receita Fechada — '+fmtDateBR(new Date(period.start+'T00:00:00'))+' a '+fmtDateBR(new Date(period.end+'T00:00:00'));
    destination='oportunidades';
    body.innerHTML = items.length ? `
      <p style="margin-top:0;color:#667085">Negócios marcados como fechados dentro do período selecionado no Dashboard.</p>
      ${items.map(d=>detailItem(
        'Fechado',
        d.company,
        d.title,
        `<b>${money(d.value)}</b> <span class="tag green">100%</span>`
      )).join('')}` : emptyDetail('Nenhuma oportunidade fechada neste período.');
  }
  else if(type==='meta'){
    const target=data.settings.monthlyTarget;
    const closed=data.deals.filter(d=>d.stage==='Fechado').reduce((a,d)=>a+d.value,0);
    const pct=Math.min(100,closed/target*100);
    heading='Meta do Mês';
    destination='relatorios';
    body.innerHTML=`
      <div class="card panel">
        <div style="display:flex;justify-content:space-between;gap:12px">
          <span>Meta</span><b>${money(target)}</b>
        </div>
        <div style="display:flex;justify-content:space-between;gap:12px;margin-top:8px">
          <span>Realizado</span><b class="up">${money(closed)}</b>
        </div>
        <div class="progress" style="height:10px;margin-top:14px"><i style="width:${pct}%"></i></div>
        <p style="margin-bottom:0;color:#667085">${Math.round(pct)}% da meta atingida.</p>

  }

     if(c.status!=='Cliente')return false;
     const hist=(data.contactHistory||[]).filter(h=>h.company===c.name&&h.outcome).sort((a,b)=>(b.date+b.time)>(a.date+a.time)?1:-1);
     return hist.length>=2&&hist[0].outcome==='improdutivo'&&hist[1].outcome==='improdutivo';

    destination='empresas';
    body.innerHTML = items.length ? `

      ${items.map(c=>detailItem(

        c.name,

        `${followupBadge(c)} ${actionIcons(c.phone,c.name)}`
      )).join('')}` : emptyDetail('Nenhum cliente com contatos improdutivos seguidos no momento.');

    destination='oportunidades';

      <p style="margin-top:0;color:#667085">Oportunidades abertas com valor a partir de R$ 50.000.</p>
      ${items.map(d=>detailItem(
        d.stage,
        d.company,
        d.title,
        `<b>${money(d.value)}</b> <span class="tag ${d.prob>=60?'green':d.prob>=40?'orange':''}">${d.prob}%</span> ${actionIcons(companyPhone(d.company),d.company)}`

        c.status,

  else if(type==='allDeals'){

  }

  title.textContent=heading;

function scheduleNextStepForDeal(deal, oldStage, isNew){
 if(!deal || deal.stage==='Fechado') return;
 const offsets={'Qualificação':1,'Reunião':1,'Proposta':2,'Negociação':1};
 const days=offsets[deal.stage];
 if(!days) return;
 const exists=data.tasks.some(t=>t.dealId===deal.id && t.status!=='Concluída' && t.type==='Tarefa');
 if(exists) return;
 const d=new Date(); d.setDate(d.getDate()+days);
 data.tasks.push({id:Date.now()+Math.random(),dealId:deal.id,title:'Follow-up: '+deal.title,company:deal.company,date:d.toISOString().slice(0,10),time:'09:00',type:deal.stage==='Proposta'?'Ligação':'Tarefa',status:'Pendente'});
}
function handleProposalAutomation(proposal,previousStatus){
 if(!proposal)return;
 if(proposal.status==='Aprovada' && previousStatus!=='Aprovada'){
  data.tasks.push({id:Date.now()+Math.random(),title:'Fechamento/Onboarding: '+proposal.item,company:proposal.company,date:today(),time:'10:00',type:'Tarefa',status:'Pendente'});
  toast('Proposta aprovada — tarefa de fechamento/onboarding criada automaticamente');
  return;
 }
 if(proposal.status==='Recusada' && previousStatus!=='Recusada'){
  showConfirm('Proposta marcada como recusada. Criar uma tarefa de novo follow-up com essa empresa em 30 dias?',()=>{
   const next=new Date();next.setDate(next.getDate()+30);
   data.tasks.push({id:Date.now()+Math.random(),title:'Novo follow-up após proposta recusada',company:proposal.company,date:next.toISOString().slice(0,10),time:'10:00',type:'Tarefa',status:'Pendente'});
   save();
   toast('Tarefa de follow-up criada para daqui a 30 dias');
  },'Criar follow-up');
 }
}
function handleDealAutomation(deal, previousStage, isNew){
 if(!deal)return;
 if(deal.stage==='Fechado'){
   data.tasks.push({id:Date.now()+Math.random(),dealId:deal.id,title:'Encaminhar implantação: '+deal.title,company:deal.company,date:today(),time:'10:00',type:'Tarefa',status:'Pendente'});
   return;
 }
 scheduleNextStepForDeal(deal,previousStage,isNew);
}
function completeTask(id){const t=data.tasks.find(x=>x.id===id);if(t){t.status=t.status==='Concluída'?'Pendente':'Concluída';if(t.status==='Concluída' && t.dealId){const d=data.deals.find(x=>x.id===t.dealId);if(d){const next=new Date();next.setDate(next.getDate()+2);d.next=next.toISOString().slice(0,10)}}save();toast(t.status==='Concluída'?'Tarefa concluída':'Tarefa reaberta')}}
function saveForm(type,collection,id){
 const defs={company:['name','cnpj','city','phone','address','email','segment','status','origin','leadScore','owner','notes'],contact:['name','company','role','cel','tel','email'],deal:['company','title','value','stage','prob','priority','next','notes'],task:['title','company','contact','date','time','type','status'],proposal:['company','item','value','date','status'],product:['name','category','price','active'],event:['title','company','date','time']};
 const obj={};defs[type].forEach(k=>{let v=document.getElementById('f_'+k)?.value??'';if(['value','prob','price','leadScore'].includes(k))v=Number(v);obj[k]=v});
 if(type==='company' && obj.phone)obj.phone=formatPhoneBR(obj.phone);
 if(type==='contact'){if(obj.cel)obj.cel=formatPhoneBR(obj.cel);if(obj.tel)obj.tel=formatPhoneBR(obj.tel)}
 if(type==='company' && obj.cnpj)obj.cnpj=formatCNPJ(obj.cnpj);
 if(type==='company' && !obj.name.trim()){toast('Informe o nome da empresa');return}
 if(type==='task' && !obj.company.trim()){toast('Informe a empresa');return}
 if(type==='deal' && !obj.company.trim()){toast('Informe a empresa');return}
 if(type==='proposal' && !obj.company.trim()){toast('Informe a empresa');return}
 if(type==='event' && !obj.company.trim()){toast('Informe a empresa');return}
 if((type==='company'||type==='contact') && !isValidEmail(obj.email)){toast('E-mail inválido — confira o endereço digitado');return}
 if(type==='company' && obj.cnpj && !isValidCNPJ(obj.cnpj)){toast('CNPJ inválido — confira os números digitados');return}
 if(type==='company' && obj.phone && !isValidPhoneField(obj.phone)){toast('Telefone inválido — confira o DDD e o número');return}
 if(type==='contact' && obj.cel && !isValidPhoneField(obj.cel)){toast('Celular inválido — confira o DDD e o número');return}
 if(type==='contact' && obj.tel && !isValidPhoneField(obj.tel)){toast('Telefone fixo inválido — confira o DDD e o número');return}
 if(type==='company'){
  const dupName=data.companies.find(c=>c.id!==id && c.name.trim().toLowerCase()===obj.name.trim().toLowerCase());
  if(dupName){toast('Já existe uma empresa cadastrada com esse nome: "'+dupName.name+'"');return}
  if(obj.cnpj){
   const cnpjDigits=digits(obj.cnpj);
   const dupCnpj=data.companies.find(c=>c.id!==id && c.cnpj && digits(c.cnpj)===cnpjDigits);
   if(dupCnpj){toast('Já existe uma empresa cadastrada com esse CNPJ: "'+dupCnpj.name+'"');return}
  }
 }
 let extraMsg='';
 if(['contact','deal','task','proposal','event'].includes(type) && obj.company && obj.company.trim()){
  const cname=obj.company.trim();
  const found=data.companies.find(c=>c.name.toLowerCase()===cname.toLowerCase());
  if(found){obj.company=found.name}
  else{
   data.companies.push({id:Date.now()+Math.random(),name:cname,city:'',phone:'',segment:'ISP',status:'Lead',origin:'Captação de lead',owner:'Fábio Chiesa',leadScore:50});
   extraMsg=' + empresa "'+cname+'" cadastrada automaticamente';
  }
 }
 if(id){
   const arr=data[collection],i=arr.findIndex(x=>x.id===id);if(i>=0){
     const old=arr[i];arr[i]={...old,...obj};
     if(type==='deal' && old.stage!==obj.stage){
      if(obj.stage==='Fechado')arr[i].closedAt=today();
      arr[i].stageEnteredAt=today();
      handleDealAutomation(arr[i],old.stage,false);
      if(obj.stage==='Perdido'){save();closeModal();openLossReasonMenu(id);return}
     }
     if(type==='proposal' && old.status!==obj.status) handleProposalAutomation(arr[i],old.status);
   }
 }else{
   obj.id=Date.now();
   if(type==='deal' && obj.stage==='Fechado')obj.closedAt=today();
   data[collection].push(obj);
   if(type==='deal') handleDealAutomation(obj,null,true);
 }
 if(type==='company' && !id && pendingReturnForm){
  const rt=pendingReturnForm,rid=pendingReturnId,newName=obj.name;
  pendingReturnForm=null;pendingReturnId=null;
  save();
  openForm(rt,rid);
  const inp=document.getElementById('f_company');
  if(inp)inp.value=newName;
  toast('Empresa cadastrada e selecionada');
  return;
 }
 if(type==='contact' && pendingReturnForm==='company'){
  const rid=pendingReturnId;
  pendingReturnForm=null;pendingReturnId=null;
  save();
  openForm('company',rid);
  toast((id?'Contato atualizado':'Contato adicionado')+extraMsg);
  return;
 }
 let baseMsg=id?'Registro atualizado':'Registro criado';
 if(type==='deal' && !id)baseMsg='Oportunidade criada e disponível no Pipeline';
 closeModal();save();toast(baseMsg+extraMsg);
}

     ${c.cel?callBtn(c.cel,'📞','Ligar celular',companyName,c.name):''}
     ${c.tel?callBtn(c.tel,'☎️','Ligar fixo',companyName,c.name):''}
     <button class="btn small" onclick="event.preventDefault();editContactFromCompany(${c.id},${companyId})" title="Editar contato">✎</button>
     <button class="btn small danger" onclick="event.preventDefault();deleteContactFromCompany(${c.id},${companyId})" title="Excluir contato">🗑</button>
    </div>
   </div>`).join(''):'<div style="padding:10px;color:#8a94a3;font-size:13px">Nenhum contato vinculado ainda.</div>';
 return `<div class="card panel" style="margin-top:16px">
   <div class="panel-head"><h3>Contatos vinculados</h3><a href="#" onclick="event.preventDefault();quickAddContact(${companyId})" style="font-size:12px;font-weight:600;color:#3b82f6">＋ Novo contato</a></div>
   ${rows}
  </div>`;
}

function dropDeal(e,stage){
 e.currentTarget.classList.remove('drop-target');
 const raw=e.dataTransfer.getData('text/plain');
 if(raw.startsWith('contact:')){
  const cid=Number(raw.slice(8));
  const h=(data.contactHistory||[]).find(x=>x.id===cid);
  if(!h)return;
  const nextId=Math.max(0,...data.deals.map(x=>x.id))+1;
  const channelLabel=h.channel==='whatsapp'?'WhatsApp':h.channel==='telefone'?'ligação':'contato';
  data.deals.push({id:nextId,company:h.company,title:'Oportunidade via '+channelLabel+(h.contactName?' com '+h.contactName:''),value:0,stage,prob:stage==='Fechado'?100:20,priority:'Média',next:''});
  save();
  toast('Oportunidade criada em "'+stage+'" a partir do contato com '+h.company);
  editItem('deal',nextId);
  return;
 }
 const id=Number(raw.startsWith('deal:')?raw.slice(5):raw);
 const d=data.deals.find(x=>x.id===id);
 if(d){
  const wasClosed=d.stage==='Fechado';
  const prevStage=d.stage;
  d.stage=stage;d.prob=stage==='Fechado'?100:stage==='Perdido'?0:d.prob;
  if(stage==='Fechado'&&!wasClosed)d.closedAt=today();
  if(stage!==prevStage)d.stageEnteredAt=today();
  save();
  if(stage==='Perdido'){openLossReasonMenu(id)}
  else toast('Oportunidade movida para '+stage);
 }
}

 if(q.length<2){box.innerHTML='';box.classList.remove('show');return;}
 const results=[];
 data.companies.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).slice(0,5).forEach(x=>results.push({type:'Empresa',title:x.name,sub:[x.city,x.phone].filter(Boolean).join(' • '),page:'empresas'}));
 data.contacts.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).slice(0,5).forEach(x=>results.push({type:'Contato',title:x.name,sub:[x.company,x.role].filter(Boolean).join(' • '),page:'contatos'}));
 data.deals.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).slice(0,5).forEach(x=>results.push({type:'Oportunidade',title:x.title,sub:[x.company,money(x.value)].filter(Boolean).join(' • '),page:'oportunidades'}));
 data.tasks.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).slice(0,5).forEach(x=>results.push({type:'Tarefa',title:x.title,sub:[x.company,x.date].filter(Boolean).join(' • '),page:'tarefas'}));
 box.innerHTML=results.length?results.map((r,i)=>`<div class="search-result" onclick="showPage('${r.page}');document.getElementById('globalResults').classList.remove('show')"><b>${esc(r.title)}</b><small>${esc(r.type)} • ${esc(r.sub)}</small></div>`).join(''):`<div class="search-empty">Nenhum resultado encontrado.</div>`;
 box.classList.add('show');
}

function backup(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});downloadBlob(blob,'isp-sales-crm-backup.json')}
function silentBackup(){try{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});downloadBlob(blob,'isp-sales-crm-backup-auto-'+today()+'.json')}catch(e){}}
function restoreBackup(){
 const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
 inp.onchange=()=>{
  const file=inp.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
   let parsed;
   try{parsed=JSON.parse(String(r.result||''))}catch(e){toast('Arquivo inválido: não é um JSON de backup válido');return}
   const requiredKeys=['companies','contacts','deals','tasks','proposals'];
   const missing=requiredKeys.filter(k=>!Array.isArray(parsed[k]));
   if(missing.length){toast('Arquivo não parece um backup do CRM (faltando: '+missing.join(', ')+')');return}
   showConfirm('Restaurar este backup? Os dados atuais serão substituídos (um backup de segurança será baixado antes).',()=>{
    silentBackup();
    data=parsed;
    save();
    toast('Backup restaurado com sucesso');
   },'Restaurar');
  };
  r.onerror=()=>{toast('Erro ao ler o arquivo')};
  r.readAsText(file,'UTF-8');
 };
 inp.click();
}
function exportCSV(col){const rows=data[col];if(!rows.length)return;const keys=Object.keys(rows[0]);const csv=[keys.join(';'),...rows.map(r=>keys.map(k=>`"${String(r[k]??'').replace(/"/g,'""')}"`).join(';'))].join('\\n');downloadBlob(new Blob(['\\ufeff'+csv],{type:'text/csv;charset=utf-8'}),col+'.csv')}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
const EXCEL_SHEETS={Empresas:'companies',Contatos:'contacts',Oportunidades:'deals',Tarefas:'tasks',Propostas:'proposals'};
function exportExcel(){
 if(typeof XLSX==='undefined'){toast('Biblioteca de Excel não carregou — verifique sua conexão com a internet');return}
 const wb=XLSX.utils.book_new();
 Object.entries(EXCEL_SHEETS).forEach(([label,col])=>{
  const rows=data[col]||[];
  const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{}]);
  XLSX.utils.book_append_sheet(wb,ws,label);
 });
 XLSX.writeFile(wb,'isp-sales-crm-'+today()+'.xlsx');
}
function importExcel(){
 if(typeof XLSX==='undefined'){toast('Biblioteca de Excel não carregou — verifique sua conexão com a internet');return}
 const inp=document.createElement('input');inp.type='file';inp.accept='.xlsx,.xls';
 inp.onchange=()=>{
  const file=inp.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
   try{
    const wb=XLSX.read(r.result,{type:'array'});
    const found=Object.keys(EXCEL_SHEETS).filter(label=>wb.SheetNames.includes(label));
    if(!found.length){toast('Planilha sem abas reconhecidas. Use uma exportada pelo próprio CRM (abas: Empresas, Contatos, Oportunidades, Tarefas, Propostas)');return}
    const preview=found.map(label=>label+': '+XLSX.utils.sheet_to_json(wb.Sheets[label],{defval:''}).length+' registro(s)').join(', ');
    showConfirm('Importar planilha? Isso vai SUBSTITUIR os dados das abas encontradas ('+preview+'). Um backup de segurança será baixado antes.',()=>{
     silentBackup();
     found.forEach(label=>{
      const col=EXCEL_SHEETS[label];
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[label],{defval:''});
      data[col]=rows.map(row=>{
       const o={...row};
       o.id=(o.id!==''&&o.id!==undefined&&!isNaN(o.id))?Number(o.id):(o.id||(Date.now()+Math.random()));
       return o;
      });
     });
     save();
     toast('Planilha importada com sucesso ('+preview+')');
    },'Importar');
   }catch(e){toast('Erro ao ler a planilha: verifique se é um arquivo .xlsx válido')}
  };
  r.onerror=()=>{toast('Erro ao ler o arquivo')};
  r.readAsArrayBuffer(file);
 };
 inp.click();
}
function importCSV(){const inp=document.createElement('input');inp.type='file';inp.accept='.csv,text/csv';inp.onchange=()=>{const file=inp.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{
 try{
  let text=String(r.result||'').replace(/^\uFEFF/,'');
  const lines=text.split(/\r\n|\r|\n/).filter(l=>l.trim().length>0);
  if(!lines.length){toast('Arquivo CSV vazio ou inválido');return}
  const sep=lines[0].includes(';')?';':',';
  const splitLine=l=>l.match(/("([^"]|"")*"|[^;,]+)/g)?.map(x=>x.replace(/^"|"$/g,'').replace(/""/g,'"').trim())||[];
  const head=splitLine(lines.shift());
  let count=0;
  const existingCsvNames=new Set(data.companies.map(c=>String(c.name).trim().toLowerCase()));
  lines.forEach(line=>{
   const vals=splitLine(line);
   if(!vals.length)return;
   const o={};head.forEach((h,i)=>o[h]=vals[i]||'');
   const name=o.name||o.Empresa||o.empresa||o.Nome||o.nome;
   if(!name)return;
   if(existingCsvNames.has(String(name).trim().toLowerCase()))return;
   const rawPhone=o.phone||o.Telefone||o.telefone||'';
   data.companies.push({id:Date.now()+Math.random(),name,city:o.city||o.Cidade||o.cidade||'',phone:rawPhone?formatPhoneBR(rawPhone):'',segment:'ISP',status:'Lead',origin:'Captação de lead',owner:'Fábio Chiesa',leadScore:50});
   existingCsvNames.add(String(name).trim().toLowerCase());
   count++;
  });
  save();
  toast(count?count+' lead(s) importado(s) com sucesso':'Nenhum registro válido encontrado no arquivo');
 }catch(err){
  toast('Erro ao importar arquivo: verifique o formato do CSV');
 }
};r.onerror=()=>{toast('Erro ao ler o arquivo')};r.readAsText(file,'UTF-8')};inp.click()}
